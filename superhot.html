<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER HOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        #gameCanvas {
            display: block;
            cursor: none;
        }

        #videoContainer {
            position: fixed;
            bottom: 10px;
            right: 10px;
            border: 2px solid #ff0000;
            border-radius: 8px;
            overflow: hidden;
            z-index: 100;
        }

        #webcam {
            width: 480px;
            height: 360px;
            transform: scaleX(-1);
            display: block;
        }

        #handCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 480px;
            height: 360px;
            transform: scaleX(-1);
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #overlay h1 {
            font-size: 120px;
            color: #fff;
            letter-spacing: 20px;
            text-shadow: 0 0 50px #ff0000;
            animation: pulse 2s ease-in-out infinite;
        }

        #overlay h1 span {
            color: #ff0000;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #overlay p {
            color: #888;
            font-size: 24px;
            margin-top: 40px;
        }

        #overlay .controls {
            margin-top: 40px;
            color: #666;
            font-size: 16px;
            text-align: center;
            line-height: 2;
        }

        #startBtn {
            margin-top: 50px;
            padding: 20px 60px;
            font-size: 32px;
            background: transparent;
            border: 3px solid #ff0000;
            color: #ff0000;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 5px;
            transition: all 0.3s;
        }

        #startBtn:hover {
            background: #ff0000;
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        #superhotText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: #ff0000;
            letter-spacing: 15px;
            opacity: 0;
            z-index: 150;
            text-shadow: 0 0 50px #ff0000;
            pointer-events: none;
        }

        #superhotText.show {
            animation: superhotFlash 2s ease-out forwards;
        }

        @keyframes superhotFlash {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            40% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #ff0000;
            font-size: 14px;
            z-index: 100;
        }

        #timeIndicator {
            position: fixed;
            top: 10px;
            right: 270px;
            color: #ff0000;
            font-size: 18px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="videoContainer">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="handCanvas" width="480" height="360"></canvas>
    </div>

    <div id="status">Initializing...</div>
    <div id="timeIndicator">TIME: FROZEN</div>
    <div id="superhotText">SUPER HOT</div>

    <div id="overlay">
        <h1>SUPER <span>HOT</span></h1>
        <p>TIME MOVES ONLY WHEN YOU MOVE</p>
        <div class="controls">
            ✋ MOVE HAND - Move &amp; Control Time<br>
            👊 PUNCH - Attack Enemies<br>
            🤏 GRAB - Catch Thrown Objects<br>
            🎯 Dodge red projectiles!
        </div>
        <button id="startBtn">START</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const handCanvas = document.getElementById('handCanvas');
        const handCtx = handCanvas.getContext('2d');
        const video = document.getElementById('webcam');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const timeIndicator = document.getElementById('timeIndicator');
        const superhotText = document.getElementById('superhotText');

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let gameStarted = false;
        let gameOver = false;
        let wave = 1;
        let kills = 0;
        let playerHealth = 3;

        // Time mechanics
        let timeScale = 0.02; // Nearly frozen
        const MAX_TIME_SCALE = 1.0;
        const MIN_TIME_SCALE = 0.02;
        let handMovement = 0;
        let lastHandPos = { x: 0.5, y: 0.5 };

        // Player (hand controlled)
        let player = {
            x: 0.5,
            y: 0.5,
            handX: 0.5,
            handY: 0.5,
            fistClosed: false,
            velocity: { x: 0, y: 0 },
            punchCooldown: 0,
            grabbing: null
        };

        // Game objects
        let enemies = [];
        let bullets = [];
        let particles = [];
        let shards = [];
        let thrownObjects = [];

        // Enemy class
        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 120;
                this.health = 1;
                this.state = 'approaching'; // approaching, aiming, shooting, dead
                this.stateTimer = 0;
                this.targetX = 0.5;
                this.targetY = 0.5;
                this.speed = 0.001 + Math.random() * 0.001;
                this.aimTime = 60 + Math.random() * 60;
                this.hasGun = Math.random() > 0.3;
                this.armAngle = 0;
            }

            update(dt) {
                const scaledDt = dt * timeScale;

                switch (this.state) {
                    case 'approaching':
                        // Move toward player
                        const dx = player.handX - this.x;
                        const dy = player.handY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist > 0.25) {
                            this.x += (dx / dist) * this.speed * scaledDt * 60;
                            this.y += (dy / dist) * this.speed * scaledDt * 60;
                        } else {
                            this.state = 'aiming';
                            this.stateTimer = 0;
                        }

                        // Update arm angle to point at player
                        this.armAngle = Math.atan2(dy, dx);
                        break;

                    case 'aiming':
                        this.stateTimer += scaledDt * 60;
                        // Track player
                        const aimDx = player.handX - this.x;
                        const aimDy = player.handY - this.y;
                        this.armAngle = Math.atan2(aimDy, aimDx);

                        if (this.stateTimer >= this.aimTime) {
                            this.state = 'shooting';
                            this.shoot();
                        }
                        break;

                    case 'shooting':
                        this.stateTimer += scaledDt * 60;
                        if (this.stateTimer >= 30) {
                            this.state = 'aiming';
                            this.stateTimer = 0;
                            this.aimTime = 40 + Math.random() * 40;
                        }
                        break;
                }
            }

            shoot() {
                if (!this.hasGun) return;

                const angle = this.armAngle;
                bullets.push({
                    x: this.x + Math.cos(angle) * 0.05,
                    y: this.y + Math.sin(angle) * 0.05,
                    vx: Math.cos(angle) * 0.015,
                    vy: Math.sin(angle) * 0.015,
                    fromEnemy: true
                });
            }

            draw() {
                const screenX = this.x * canvas.width;
                const screenY = this.y * canvas.height;

                // Body (crystalline red)
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.moveTo(screenX, screenY - 50);
                ctx.lineTo(screenX + 25, screenY + 30);
                ctx.lineTo(screenX - 25, screenY + 30);
                ctx.closePath();
                ctx.fill();

                // Head
                ctx.beginPath();
                ctx.arc(screenX, screenY - 60, 20, 0, Math.PI * 2);
                ctx.fill();

                // Arm with gun
                if (this.hasGun) {
                    ctx.save();
                    ctx.translate(screenX, screenY - 20);
                    ctx.rotate(this.armAngle);

                    // Arm
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(0, -5, 40, 10);

                    // Gun
                    ctx.fillStyle = '#880000';
                    ctx.fillRect(35, -8, 25, 16);

                    ctx.restore();
                }

                // Glowing effect
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(screenX, screenY - 60, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            shatter() {
                const screenX = this.x * canvas.width;
                const screenY = this.y * canvas.height;

                for (let i = 0; i < 20; i++) {
                    shards.push({
                        x: screenX + (Math.random() - 0.5) * 60,
                        y: screenY + (Math.random() - 0.5) * 100,
                        vx: (Math.random() - 0.5) * 15,
                        vy: (Math.random() - 0.5) * 15 - 5,
                        rotation: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() - 0.5) * 0.3,
                        size: 10 + Math.random() * 20,
                        life: 60
                    });
                }
            }
        }

        // Spawn enemies
        function spawnWave() {
            const numEnemies = 2 + wave;
            for (let i = 0; i < numEnemies; i++) {
                // Spawn from edges
                let x, y;
                const side = Math.floor(Math.random() * 4);
                switch (side) {
                    case 0: x = -0.1; y = Math.random(); break;
                    case 1: x = 1.1; y = Math.random(); break;
                    case 2: x = Math.random(); y = -0.1; break;
                    case 3: x = Math.random(); y = 1.1; break;
                }
                enemies.push(new Enemy(x, y));
            }
        }

        // Hand tracking
        let handLandmarks = null;

        async function initHandTracking() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                video.srcObject = stream;

                const camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({ image: video });
                    },
                    width: 640,
                    height: 480
                });

                camera.start();
                statusEl.textContent = 'Hand tracking ready!';
            } catch (err) {
                statusEl.textContent = 'Camera error: ' + err.message;
            }
        }

        function onHandResults(results) {
            // Draw hand tracking overlay on video
            drawHandOverlay(results);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handLandmarks = results.multiHandLandmarks[0];

                // Get palm center (average of key points)
                const palm = handLandmarks[9]; // Middle finger MCP
                const newX = 1 - palm.x; // Mirror
                const newY = palm.y;

                // Calculate movement
                const dx = newX - lastHandPos.x;
                const dy = newY - lastHandPos.y;
                handMovement = Math.sqrt(dx * dx + dy * dy);

                lastHandPos = { x: newX, y: newY };

                // Update player position
                player.handX = newX;
                player.handY = newY;
                player.velocity.x = dx;
                player.velocity.y = dy;

                // Detect fist (closed hand)
                player.fistClosed = detectFist(handLandmarks);

                // Update time scale based on movement
                if (handMovement > 0.005) {
                    timeScale = Math.min(MAX_TIME_SCALE, timeScale + 0.1);
                } else {
                    timeScale = Math.max(MIN_TIME_SCALE, timeScale - 0.05);
                }
            } else {
                handLandmarks = null;
                // Slow down time when hand not detected
                timeScale = Math.max(MIN_TIME_SCALE, timeScale - 0.02);
            }
        }

        function detectFist(landmarks) {
            // Check if fingers are curled
            const fingertips = [8, 12, 16, 20];
            const fingerPIPs = [6, 10, 14, 18];

            let curledCount = 0;
            for (let i = 0; i < fingertips.length; i++) {
                if (landmarks[fingertips[i]].y > landmarks[fingerPIPs[i]].y) {
                    curledCount++;
                }
            }

            return curledCount >= 3;
        }

        function drawHandOverlay(results) {
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

            const landmarks = results.multiHandLandmarks[0];
            const isFist = detectFist(landmarks);

            // Hand connections
            const connections = [
                [0, 1], [1, 2], [2, 3], [3, 4],           // Thumb
                [0, 5], [5, 6], [6, 7], [7, 8],           // Index
                [0, 9], [9, 10], [10, 11], [11, 12],      // Middle
                [0, 13], [13, 14], [14, 15], [15, 16],    // Ring
                [0, 17], [17, 18], [18, 19], [19, 20],    // Pinky
                [5, 9], [9, 13], [13, 17], [0, 17]        // Palm
            ];

            // Scale to canvas
            const scale = (lm) => ({
                x: lm.x * handCanvas.width,
                y: lm.y * handCanvas.height
            });

            // Draw glow effect for skeleton
            handCtx.shadowColor = isFist ? '#ff0000' : '#00ffff';
            handCtx.shadowBlur = 15;

            // Draw connections (bones)
            handCtx.strokeStyle = isFist ? 'rgba(255, 0, 0, 0.9)' : 'rgba(0, 255, 255, 0.9)';
            handCtx.lineWidth = 3;

            connections.forEach(([a, b]) => {
                const p1 = scale(landmarks[a]);
                const p2 = scale(landmarks[b]);

                handCtx.beginPath();
                handCtx.moveTo(p1.x, p1.y);
                handCtx.lineTo(p2.x, p2.y);
                handCtx.stroke();
            });

            // Draw joints with different sizes
            landmarks.forEach((lm, i) => {
                const p = scale(lm);

                // Determine joint size
                let radius = 5;
                if (i === 0) radius = 10; // Wrist
                else if ([4, 8, 12, 16, 20].includes(i)) radius = 8; // Fingertips
                else if ([1, 5, 9, 13, 17].includes(i)) radius = 7; // MCPs

                // Outer glow
                handCtx.beginPath();
                handCtx.arc(p.x, p.y, radius + 3, 0, Math.PI * 2);
                handCtx.fillStyle = isFist ? 'rgba(255, 0, 0, 0.4)' : 'rgba(0, 255, 255, 0.4)';
                handCtx.fill();

                // Main joint
                handCtx.beginPath();
                handCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                handCtx.fillStyle = isFist ? '#ff0000' : '#00ffff';
                handCtx.fill();

                // White border
                handCtx.strokeStyle = '#ffffff';
                handCtx.lineWidth = 1;
                handCtx.stroke();

                // Joint index number
                handCtx.font = '8px Arial';
                handCtx.fillStyle = '#ffffff';
                handCtx.fillText(i.toString(), p.x - 3, p.y + 3);
            });

            handCtx.shadowBlur = 0;

            // Draw velocity vector
            if (handMovement > 0.005) {
                const palm = scale(landmarks[9]);
                const velScale = 800;
                const endX = palm.x - player.velocity.x * velScale; // Inverted for mirrored view
                const endY = palm.y + player.velocity.y * velScale;

                // Velocity line
                handCtx.strokeStyle = '#ffff00';
                handCtx.lineWidth = 3;
                handCtx.setLineDash([8, 4]);
                handCtx.beginPath();
                handCtx.moveTo(palm.x, palm.y);
                handCtx.lineTo(endX, endY);
                handCtx.stroke();
                handCtx.setLineDash([]);

                // Arrowhead
                const angle = Math.atan2(endY - palm.y, endX - palm.x);
                const arrowSize = 12;
                handCtx.fillStyle = '#ffff00';
                handCtx.beginPath();
                handCtx.moveTo(endX, endY);
                handCtx.lineTo(
                    endX - arrowSize * Math.cos(angle - Math.PI / 6),
                    endY - arrowSize * Math.sin(angle - Math.PI / 6)
                );
                handCtx.lineTo(
                    endX - arrowSize * Math.cos(angle + Math.PI / 6),
                    endY - arrowSize * Math.sin(angle + Math.PI / 6)
                );
                handCtx.closePath();
                handCtx.fill();
            }

            // Draw punch range circle when fist
            if (isFist) {
                const palm = scale(landmarks[9]);
                const punchRange = 80;

                // Pulsing effect
                const pulseSize = Math.sin(Date.now() / 100) * 5;

                handCtx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
                handCtx.lineWidth = 2;
                handCtx.setLineDash([10, 5]);
                handCtx.beginPath();
                handCtx.arc(palm.x, palm.y, punchRange + pulseSize, 0, Math.PI * 2);
                handCtx.stroke();
                handCtx.setLineDash([]);

                // Inner solid circle
                handCtx.fillStyle = 'rgba(255, 0, 0, 0.15)';
                handCtx.beginPath();
                handCtx.arc(palm.x, palm.y, punchRange, 0, Math.PI * 2);
                handCtx.fill();
            }

            // Draw finger labels at fingertips
            const fingerNames = ['THB', 'IDX', 'MID', 'RNG', 'PNK'];
            const fingerTips = [4, 8, 12, 16, 20];

            handCtx.font = 'bold 10px Arial';

            fingerTips.forEach((tipIdx, i) => {
                const tip = scale(landmarks[tipIdx]);

                // Check if finger is extended
                const isExtended = landmarks[tipIdx].y < landmarks[tipIdx - 2].y - 0.02;

                handCtx.fillStyle = isExtended ? '#00ff00' : '#ff6600';
                handCtx.strokeStyle = '#000';
                handCtx.lineWidth = 2;

                const label = isExtended ? `${fingerNames[i]}↑` : `${fingerNames[i]}↓`;
                handCtx.strokeText(label, tip.x - 12, tip.y - 12);
                handCtx.fillText(label, tip.x - 12, tip.y - 12);
            });

            // Draw info panel
            const infoX = 5;
            const infoY = 5;

            handCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            handCtx.fillRect(infoX, infoY, 180, 100);
            handCtx.strokeStyle = isFist ? '#ff0000' : '#00ffff';
            handCtx.lineWidth = 2;
            handCtx.strokeRect(infoX, infoY, 180, 100);

            handCtx.font = 'bold 12px Arial';
            handCtx.fillStyle = '#ffffff';
            handCtx.fillText('HAND TRACKING', infoX + 5, infoY + 15);

            handCtx.font = '11px Arial';
            handCtx.fillStyle = isFist ? '#ff0000' : '#00ffff';
            handCtx.fillText(`State: ${isFist ? '👊 FIST' : '✋ OPEN'}`, infoX + 5, infoY + 32);

            handCtx.fillStyle = '#ffff00';
            handCtx.fillText(`Movement: ${(handMovement * 1000).toFixed(1)}`, infoX + 5, infoY + 47);

            handCtx.fillStyle = '#ffffff';
            handCtx.fillText(`Time: ${(timeScale * 100).toFixed(0)}%`, infoX + 5, infoY + 62);

            // Time scale bar
            handCtx.fillStyle = '#333';
            handCtx.fillRect(infoX + 55, infoY + 53, 80, 8);
            const timeColor = timeScale > 0.5 ? '#ff0000' : (timeScale > 0.1 ? '#ffaa00' : '#00ff00');
            handCtx.fillStyle = timeColor;
            handCtx.fillRect(infoX + 55, infoY + 53, 80 * timeScale, 8);

            handCtx.fillStyle = '#aaaaaa';
            handCtx.fillText(`Pos: (${(landmarks[9].x).toFixed(2)}, ${(landmarks[9].y).toFixed(2)})`, infoX + 5, infoY + 77);

            // Landmarks count
            handCtx.fillStyle = '#888888';
            handCtx.fillText(`21 landmarks tracked`, infoX + 5, infoY + 92);
        }

        // Punch detection and handling
        let lastFistState = false;
        let punchVelocity = { x: 0, y: 0 };

        function handlePunch() {
            if (player.fistClosed && !lastFistState && player.punchCooldown <= 0) {
                // Punch initiated!
                punchVelocity = { ...player.velocity };
                player.punchCooldown = 20;

                // Check for enemy hits
                const punchRange = 0.15;
                enemies.forEach((enemy, index) => {
                    const dx = enemy.x - player.handX;
                    const dy = enemy.y - player.handY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < punchRange) {
                        enemy.shatter();
                        enemies.splice(index, 1);
                        kills++;
                        createHitEffect(enemy.x * canvas.width, enemy.y * canvas.height);

                        // Brief time freeze on kill
                        timeScale = MIN_TIME_SCALE;
                    }
                });

                // Deflect bullets
                bullets.forEach((bullet, index) => {
                    const dx = bullet.x - player.handX;
                    const dy = bullet.y - player.handY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 0.1) {
                        // Deflect back!
                        bullet.vx = -bullet.vx * 1.5 + punchVelocity.x * 0.5;
                        bullet.vy = -bullet.vy * 1.5 + punchVelocity.y * 0.5;
                        bullet.fromEnemy = false;
                        createHitEffect(bullet.x * canvas.width, bullet.y * canvas.height);
                    }
                });
            }

            lastFistState = player.fistClosed;
            if (player.punchCooldown > 0) player.punchCooldown -= timeScale;
        }

        function createHitEffect(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    life: 30,
                    color: '#ffffff'
                });
            }
        }

        // Update game
        function update() {
            if (!gameStarted || gameOver) return;

            // Handle punching
            handlePunch();

            // Update enemies
            enemies.forEach(enemy => enemy.update(1));

            // Update bullets
            bullets = bullets.filter(bullet => {
                bullet.x += bullet.vx * timeScale;
                bullet.y += bullet.vy * timeScale;

                // Check if bullet hits player
                if (bullet.fromEnemy) {
                    const dx = bullet.x - player.handX;
                    const dy = bullet.y - player.handY;
                    if (Math.sqrt(dx * dx + dy * dy) < 0.05) {
                        playerHealth--;
                        createHitEffect(bullet.x * canvas.width, bullet.y * canvas.height);
                        if (playerHealth <= 0) {
                            gameOver = true;
                        }
                        return false;
                    }
                }

                // Check if player bullet hits enemy
                if (!bullet.fromEnemy) {
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        const enemy = enemies[i];
                        const dx = bullet.x - enemy.x;
                        const dy = bullet.y - enemy.y;
                        if (Math.sqrt(dx * dx + dy * dy) < 0.08) {
                            enemy.shatter();
                            enemies.splice(i, 1);
                            kills++;
                            return false;
                        }
                    }
                }

                return bullet.x > -0.1 && bullet.x < 1.1 && bullet.y > -0.1 && bullet.y < 1.1;
            });

            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx * timeScale;
                p.y += p.vy * timeScale;
                p.life -= timeScale * 2;
                return p.life > 0;
            });

            // Update shards
            shards = shards.filter(s => {
                s.x += s.vx * timeScale;
                s.y += s.vy * timeScale;
                s.vy += 0.5 * timeScale; // Gravity
                s.rotation += s.rotationSpeed * timeScale;
                s.life -= timeScale * 2;
                return s.life > 0;
            });

            // Check wave complete
            if (enemies.length === 0) {
                wave++;
                showSuperhot();
                setTimeout(() => spawnWave(), 2000);
            }

            // Update time indicator
            if (timeScale > 0.5) {
                timeIndicator.textContent = 'TIME: FLOWING';
                timeIndicator.style.color = '#ff0000';
            } else if (timeScale > 0.1) {
                timeIndicator.textContent = 'TIME: SLOW';
                timeIndicator.style.color = '#ff6600';
            } else {
                timeIndicator.textContent = 'TIME: FROZEN';
                timeIndicator.style.color = '#888888';
            }
        }

        function showSuperhot() {
            superhotText.classList.add('show');
            setTimeout(() => superhotText.classList.remove('show'), 2000);
        }

        // Draw game
        function draw() {
            // Clear with slight trail for motion blur effect
            ctx.fillStyle = `rgba(255, 255, 255, ${timeScale > 0.1 ? 0.3 : 1})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) return;

            // Draw grid (SUPERHOT style)
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw shards
            shards.forEach(s => {
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.rotation);
                ctx.fillStyle = `rgba(255, 0, 0, ${s.life / 60})`;
                ctx.beginPath();
                ctx.moveTo(0, -s.size / 2);
                ctx.lineTo(s.size / 3, s.size / 2);
                ctx.lineTo(-s.size / 3, s.size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // Draw enemies
            enemies.forEach(enemy => enemy.draw());

            // Draw bullets
            bullets.forEach(bullet => {
                const x = bullet.x * canvas.width;
                const y = bullet.y * canvas.height;

                // Motion trail
                if (timeScale < 0.5) {
                    ctx.strokeStyle = bullet.fromEnemy ? 'rgba(255, 0, 0, 0.5)' : 'rgba(0, 0, 0, 0.5)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - bullet.vx * canvas.width * 5, y - bullet.vy * canvas.height * 5);
                    ctx.stroke();
                }

                // Bullet
                ctx.fillStyle = bullet.fromEnemy ? '#ff0000' : '#000000';
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();

                // Glow
                ctx.shadowColor = bullet.fromEnemy ? '#ff0000' : '#000000';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life / 30})`;
                ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
            });

            // Draw player hand position
            if (handLandmarks) {
                const x = player.handX * canvas.width;
                const y = player.handY * canvas.height;

                // Hand indicator
                ctx.strokeStyle = player.fistClosed ? '#ff0000' : '#000000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.stroke();

                if (player.fistClosed) {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.fill();

                    // Punch effect
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, 50 - player.punchCooldown * 2, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // Draw UI
            ctx.fillStyle = '#000';
            ctx.font = 'bold 24px Arial Black';
            ctx.fillText(`WAVE: ${wave}`, 20, 40);
            ctx.fillText(`KILLS: ${kills}`, 20, 70);

            // Health
            ctx.fillStyle = '#ff0000';
            for (let i = 0; i < playerHealth; i++) {
                ctx.fillRect(20 + i * 30, 90, 20, 20);
            }

            // Game over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 72px Arial Black';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px Arial Black';
                ctx.fillText(`KILLS: ${kills}`, canvas.width / 2, canvas.height / 2 + 30);
                ctx.fillText('Refresh to restart', canvas.width / 2, canvas.height / 2 + 80);
                ctx.textAlign = 'left';
            }
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start
        startBtn.addEventListener('click', () => {
            overlay.classList.add('hidden');
            gameStarted = true;
            spawnWave();
            showSuperhot();
        });

        initHandTracking();
        gameLoop();
    </script>
</body>
</html>
